spring.application.name=ms-admin
server.port=8081

spring.config.import=file:../.env[.properties]

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/mpaz_admin
spring.datasource.username=mpaz_admin_app
spring.datasource.password=${MPAZ_ADMIN_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${MPAZ_JWT_SECRET}
jwt.expiration-ms=3600000