spring.application.name=ms-actividades-evaluaciones
server.port=8083

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/mpaz_actividades
spring.datasource.username=mpaz_actividades_app
spring.datasource.password=${MPAZ_ACTIVIDADES_MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
jwt.secret=${MPAZ_JWT_SECRET}
