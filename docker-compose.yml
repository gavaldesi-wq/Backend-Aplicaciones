
services:
  mysql:
    image: mysql:8.4
    container_name: mpaz-mysql
    restart: unless-stopped

    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MPAZ_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mpaz_contenidos
      MYSQL_USER: mpaz_app
      MYSQL_PASSWORD: ${MPAZ_MYSQL_PASSWORD}

    volumes:
      - mpaz_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  mpaz_mysql_data:
