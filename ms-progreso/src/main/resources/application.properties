spring.application.name=ms-progreso
server.port=8084


spring.datasource.username=mpaz_progreso_app
spring.datasource.password=${MPAZ_PROGRESO_MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


jwt.secret=${MPAZ_JWT_SECRET}
spring.datasource.url=jdbc:mysql://127.0.0.1:${MPAZ_MYSQL_PORT:13307}/mpaz_progreso
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
mpaz.actividades.url=${MPAZ_ACTIVIDADES_URL:http://127.0.0.1:18083}
mpaz.contenidos.url=${MPAZ_CONTENIDOS_URL:http://127.0.0.1:18082}