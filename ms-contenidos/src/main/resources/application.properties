
spring.application.name=ms-contenidos


server.port=8082


spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://127.0.0.1:${MPAZ_MYSQL_PORT:13307}/mpaz_contenidos
spring.datasource.username=mpaz_app
spring.datasource.password=${MPAZ_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


jwt.secret=${MPAZ_JWT_SECRET}

mpaz.recursos.directorio=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
mpaz.admin.url=${MPAZ_ADMIN_URL:http://127.0.0.1:18081}