
spring.application.name=ms-contenidos


server.port=8082




spring.datasource.url=jdbc:mysql://127.0.0.1:3307/mpaz_contenidos
spring.datasource.username=mpaz_app
spring.datasource.password=${MPAZ_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.config.import=file:../.env[.properties]
jwt.secret=${MPAZ_JWT_SECRET}
mpaz.recursos.directorio=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB